name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
# The gate battery is railform's reusable workflow, pinned below; the `gate` job is the one
# status the branch ruleset requires. The workflow token needs nothing beyond reading contents.
permissions:
  contents: read
jobs:
  # Invariant I1 (no I/O imports in core/) stays a CI job of its own: the previous `check` job ran
  # it after the suite, and `gate` now needs it. The script reads only the standard library.
  core-purity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --no-project python scripts/check_core_purity.py
  # >>> railform: owned by `railform adopt`; `railform adopt --check` fails on any edit
  railform:
    uses: grimaldost/railform/.github/workflows/python-ci.yml@3e6f27f8970700c5166b908fae65572c431b2571
    permissions:
      contents: read
    with:
      railform-sha: 3e6f27f8970700c5166b908fae65572c431b2571
  gate:
    if: always()
    needs: [railform, core-purity]
    runs-on: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && fromJSON(vars.LINUX_RUNS_ON || '"ubuntu-latest"') || 'ubuntu-latest' }}
    permissions: {}
    steps:
      - name: Fail when a needed job failed or was cancelled
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        shell: bash
        run: exit 1
  # <<< railform
