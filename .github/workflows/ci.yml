name: ci
on:
  push:
    branches: [main]
  pull_request:
# Both jobs only check out the repo and run local commands, so the workflow
# token needs nothing beyond reading contents.
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      # The committed uv.lock (which also records the root package's version)
      # must be current; a stale lock reds CI. This must run before any
      # `uv sync`/`uv run`, which would quietly re-lock first.
      - run: uv lock --check
      - run: uv sync
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run ty check src
      - run: uv run python -m pytest -q
      - run: uv run python scripts/check_core_purity.py

  changelog-currency:
    # CONTRIBUTING's changelog rule, machine-enforced: a diff that ships source
    # while CHANGELOG.md stays untouched — and no commit declares
    # `Changelog: none (<reason>)` — is an unrecorded change. PR-only: the base
    # ref is what makes the diff meaningful.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge-base with the target branch has to exist locally
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: |
          git log --format=%B "origin/${GITHUB_BASE_REF}..HEAD" > "${RUNNER_TEMP}/commit-messages.txt"
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" \
            | uv run --no-project python scripts/changelog_currency.py --messages "${RUNNER_TEMP}/commit-messages.txt"
      # Version arm: a PR that cuts a new release heading must move the newest version strictly
      # forward; the version-site equality tests in the `check` job hold every site to that
      # same heading.
      - run: |
          git show "origin/${GITHUB_BASE_REF}:CHANGELOG.md" > "${RUNNER_TEMP}/base-changelog.md"
          uv run --no-project python scripts/changelog_currency.py --headings "${RUNNER_TEMP}/base-changelog.md" CHANGELOG.md

  zizmor:
    # Security audit of GitHub Actions workflows: check for impostor refs,
    # dependency confusion, and stale action versions via zizmor.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uvx zizmor==1.30.0 --min-severity high .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
