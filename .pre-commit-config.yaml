# Pre-commit hooks. Local `language: system` hooks drive the project's own
# uv-pinned tools, so no hook downloads a second copy of ruff and the versions
# always match the project's. Run all hooks with:
#     uv run python -m pre_commit run --all-files
#
# (On this machine, bare `.exe` shims are blocked by Application Control — invoke
# pre-commit via `uv run python -m pre_commit`, not the `pre-commit` shim. That is
# also why the git hooks are NOT installed with `pre-commit install`: the checked-in
# `scripts/git-hooks/pre-commit` and `scripts/git-hooks/commit-msg` are wired with
#     git config core.hooksPath scripts/git-hooks
# and call this config through `uv run python -m pre_commit`.)
#
# Two lanes: the pre-commit stage gates the tree (format, lint, purity, the
# hermetic suite), the commit-msg stage gates the message (Conventional
# Commits, no AI-attribution trailers). Stages are explicit on every hook so
# neither lane runs the other's work.
repos:
  - repo: local
    hooks:
      # Scoped to `src tests` to match the project's canonical gate command
      # (CLAUDE.md); `notes/` and `scripts/` helpers are not linted (the latter
      # is `ALL`-ignored in pyproject anyway).
      - id: ruff-format
        name: ruff format (check)
        entry: uv run ruff format --check src tests
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check src tests
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: core-purity
        name: core purity (invariant I1 — no I/O in core/)
        entry: uv run python scripts/check_core_purity.py
        language: system
        pass_filenames: false
        files: ^src/mantis_research/core/.*\.py$
        stages: [pre-commit]

      # The suite is hermetic by construction (autouse fixtures refuse the two
      # spend seams) and runs in ~17 s, so it is cheap enough for the commit
      # lane — a commit that breaks tests should not exist, not merely not push.
      - id: pytest
        name: pytest (hermetic suite)
        entry: uv run python -m pytest -q
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: no-ai-attribution
        name: reject AI-attribution lines in commit messages
        entry: uv run python scripts/check_commit_message.py
        language: system
        stages: [commit-msg]

  # Not a project tool, so a remote hook (cloned by pre-commit itself, no .exe
  # shim involved) does not duplicate anything uv pins.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - chore
          - build
          - ci
          - release
